[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "offshore-metocean"
version = "0.1.1"
description = "Traceable wind-wave assessment and DLC candidate workbench"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<4", "scipy>=1.14,<2",
  "PySide6>=6.8,<7", "matplotlib>=3.9,<4", "openpyxl>=3.1,<4",
  "xarray>=2024.10", "h5netcdf>=1.4", "h5py>=3.12", "cdsapi>=0.7,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.9"]

[project.scripts]
offshore-metocean = "offshore_metocean.cli:main"
offshore-metocean-gui = "offshore_metocean.cli:gui_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
